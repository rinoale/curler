[package]
name = "curler"
version = "0.1.0"
edition = "2024"
authors = ["curler contributors"]
description = "Terminal HTTP client"

[dependencies]
crossterm = "0.29"
ratatui = "0.30"
rustui = { git = "https://github.com/rinoale/rustui.git", tag = "v0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
